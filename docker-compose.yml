services:
  # Hydrogram user bot (listen-only) + Bot API sender + health monitor
  bot:
    build:
      context: .                         # Repo root — so COPY bot/ and db/ both work
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./bot/sessions:/app/sessions     # Persist Hydrogram session
      - ./data:/app/data                 # SQLite database + heartbeat file
      - ./config:/app/config             # channels.yml + replacements.yml (hot-reloadable)
      - ./logs:/app/logs                 # Log files
      - ./db:/app/db                     # schema.sql access
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal

  # Redis (message queue + deduplication + album buffer)
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - internal

volumes:
  redis_data:

networks:
  internal:
    driver: bridge
